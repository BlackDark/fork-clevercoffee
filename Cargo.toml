# CleverCoffee — Rust firmware workspace.
#
# At the repository root because the justfile, scripts/ and ui/ live here.
#
# Crate roles:
#   portable   cc-domain, cc-protocol, cc-safety, cc-config, cc-machine,
#              cc-display, cc-net
#              no_std, host-tested, must not name esp_idf_* (CI: portable-purity)
#   device     cc-hal-esp32, cc-net-esp32, cc-firmware, cc-device-tests
#              Xtensa only, so not in `default-members`
#   host tools cc-parity (scenario harness), cc-alloc-count (test allocator)

[workspace]
resolver = "2"
members = [
    "crates/cc-domain",
    "crates/cc-protocol",
    "crates/cc-safety",
    "crates/cc-config",
    "crates/cc-machine",
    "crates/cc-display",
    "crates/cc-net",
    "crates/cc-hal-esp32",
    "crates/cc-net-esp32",
    "crates/cc-firmware",
    # The on-target test runner (`just test-esp32`): `cc-hal-esp32` names
    # `esp_idf_hal`, so its tests can only run on the chip. Never flashed as
    # the firmware.
    "crates/cc-device-tests",
    "crates/cc-parity",
    "crates/cc-alloc-count",
]
# `cargo test` / `cargo clippy` with no `-p` must not build the device crates.
default-members = [
    "crates/cc-domain",
    "crates/cc-protocol",
    "crates/cc-safety",
    "crates/cc-config",
    "crates/cc-machine",
    "crates/cc-display",
    "crates/cc-net",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/rbvsystems/CleverCoffee"

[workspace.dependencies]
cc-domain = { path = "crates/cc-domain" }
cc-protocol = { path = "crates/cc-protocol" }
cc-safety = { path = "crates/cc-safety" }
cc-machine = { path = "crates/cc-machine" }
cc-display = { path = "crates/cc-display" }
cc-config = { path = "crates/cc-config" }
cc-net = { path = "crates/cc-net" }
cc-hal-esp32 = { path = "crates/cc-hal-esp32" }
cc-net-esp32 = { path = "crates/cc-net-esp32" }
cc-alloc-count = { path = "crates/cc-alloc-count" }

# `cc-config`'s Serialize/Deserialize and the JSON blob. Already in the device
# graph through esp-idf-svc. `default-features = false` + `alloc` keeps the
# portable crates no_std; tests re-enable `std`.
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# ESP-IDF, pinned exactly: the three move together.
esp-idf-svc = "=0.53.0"
esp-idf-hal = "=0.47.0"
esp-idf-sys = "=0.38.1"
heapless = { version = "0.9", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }

# The OLED driver. `ssd1306` re-exports `display-interface`, so naming it adds no
# second copy. Default features off: `graphics` would link embedded-graphics for a
# driver fed `cc-display`'s own framebuffer in `BasicMode`, and `async` is unused
# because the firmware's I2C is blocking.
ssd1306 = { version = "0.10.0", default-features = false }
display-interface = "0.5.0"

# Test-only, for `cc-hal-esp32`'s fake telnet reader: the same 0.7.1 that
# `esp-idf-hal` implements, so the fake implements that trait and not a copy.
embedded-io = "0.7.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
# `allow`, not `deny`: clippy runs on two channels (pinned host stable and the
# `esp` fork), and `-D warnings` turns a lint one channel does not know into an
# error on the other. `scripts/lint-names.py` (CI) catches typos instead: every
# lint named in an allow/expect must exist on at least one channel.
unknown_lints = "allow"
# `esp-idf-sys` emits ~1300 kconfig cfgs it cannot declare with
# `rustc-check-cfg`. Declare each one the code uses here, or `-D warnings` fails
# on the device target.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(esp_idf_version_at_least_5_1_0)",
    "cfg(esp_idf_version_at_least_5_5_0)",
    "cfg(esp_idf_version_at_least_6_0_0)",
] }

# Declared here and nowhere else: also passing `-D clippy::pedantic` on the
# command line double-flags and hides this configuration.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Every suppression says why (AG-RUST-10).
allow_attributes_without_reason = "deny"

[profile.release]
opt-level = "s"     # flash size is the binding constraint
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

# Diagnostic only: release codegen with symbols and DWARF, so `addr2line` can
# name a release-only panic's frames. Costs flash; used only by the `diag-*`
# recipes, never shipped or size-measured.
[profile.diagnostic]
inherits = "release"
strip = "none"
debug = 2
