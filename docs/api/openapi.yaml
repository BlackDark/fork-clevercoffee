# CleverCoffee ESP32 API Specification
# Shared contract between the firmware's HTTP handlers and the React frontend.
# Version: 1.0.0

openapi: 3.0.3
info:
  title: CleverCoffee API
  description: REST API for ESP32 coffee machine controller
  version: 1.0.0
  contact:
    name: CleverCoffee Project

servers:
  - url: http://clevercoffee.local
    description: Default ESP32 server
  - url: /
    description: Development (use VITE_SERVER_ENDPOINT)

security:
  - basicAuth: []

tags:
  - name: Machine
    description: Machine control endpoints
  - name: Config
    description: Configuration management
  - name: Status
    description: Status and telemetry
  - name: Scale
    description: Scale control
  - name: OTA
    description: Over-the-air updates
  - name: System
    description: System operations

paths:
  # =============================================================================
  # Machine Control
  # =============================================================================

  /api/steam:
    post:
      tags: [Machine]
      summary: Toggle steam mode
      responses:
        "200":
          description: Steam mode toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  steamEnabled:
                    type: boolean

  /api/pid:
    post:
      tags: [Machine]
      summary: Toggle PID control
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: PID state changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  pidEnabled:
                    type: boolean

  /api/backflush:
    post:
      tags: [Machine]
      summary: Start backflush cycle
      responses:
        "200":
          description: Backflush started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/setpoint:
    post:
      tags: [Machine]
      summary: Set target temperature
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: number
                  format: double
      responses:
        "200":
          description: Setpoint updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # =============================================================================
  # Configuration
  # =============================================================================

  /api/config:
    get:
      tags: [Config]
      summary: Get current configuration
      description: |
        Returns the full machine configuration as a nested JSON object.
        Top-level keys are domain groups (`brew`, `pid`, `system`, …).
        Legacy flat dotted keys (e.g. `"brew.setpoint"`) are not supported.
      responses:
        "200":
          description: Nested configuration object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigFile"
    post:
      tags: [Config]
      summary: Update configuration
      description: Accepts the same nested JSON shape as GET /api/config and /api/config/download.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigFile"
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/config/download:
    get:
      tags: [Config]
      summary: Download full config as JSON file
      description: |
        Same nested JSON document as GET /api/config, served as a downloadable file.
      responses:
        "200":
          description: Nested config file (`config.json`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigFile"

  /api/config/upload:
    post:
      tags: [Config]
      summary: Upload and apply full configuration
      description: |
        Request body must be a nested JSON object (not flat dotted keys).
        On success the device validates, persists to NVS, and restarts.
      requestBody:
        required: true
        description: |
          A nested JSON object -- NOT multipart/form-data. The C++ registers an
          `AsyncCallbackJsonWebHandler` and says so at `WebServerManager.cpp:725`,
          and the UI posts the selected file's text as `application/json`
          (`ui/packages/frontend/src/pages/SystemPage.tsx:178-183`).
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigFile"
      responses:
        "200":
          description: |
            Configuration validated and applied. `restart` is true; the device
            does not reboot itself -- the client calls `POST /api/restart`. An
            invalid value anywhere in the document rejects the WHOLE document;
            nothing is applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigUploadResponse"
        "400":
          description: |
            Invalid, empty, oversized-as-a-configuration, or non-object body.
            The `message` names which, in the C++'s words.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigUploadResponse"
        "413":
          description: |
            Body over the 16384-byte transport limit (`MAX_CONFIG_UPLOAD_SIZE`,
            `WebServerManager.cpp:48`). Refused unread rather than truncated, so
            a partial configuration is never applied. Nothing is parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/parameters:
    get:
      tags: [Config]
      summary: Get parameter definitions
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, visible, editable]
      responses:
        "200":
          description: Parameter definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                    min:
                      type: number
                    max:
                      type: number
                    defaultValue:
                      type: number
                    value:
                      type: number
                    visible:
                      type: boolean
    post:
      tags: [Config]
      summary: Update parameter value
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                value:
                  type: number
      responses:
        "200":
          description: Parameter updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/parameter-help:
    get:
      tags: [Config]
      summary: Get parameter metadata/help text
      responses:
        "200":
          description: Parameter help data
          content:
            application/json:
              schema:
                type: array

  # =============================================================================
  # Status & Telemetry
  # =============================================================================

  /api/status:
    get:
      tags: [Status]
      summary: Get machine status
      responses:
        "200":
          description: Current machine state
          content:
            application/json:
              schema:
                type: object
                properties:
                  brewSwitch:
                    type: boolean
                  steamSwitch:
                    type: boolean
                  pumpSwitch:
                    type: boolean
                  setpoint:
                    type: number
                  currentTemp:
                    type: number
                  heaterPower:
                    type: number
                  pidEnabled:
                    type: boolean
                  steamMode:
                    type: boolean
                    description: |
                      The latched steam-mode flag (the C++'s `steamMode`,
                      `WebServerManager.cpp:359`). True while the machine is in
                      the steam state. This is the same fact `POST /api/steam`
                      answers in its own body.
                  brewing:
                    type: boolean
                    description: |
                      Whether a brew is in progress, derived from the current
                      state. NOT the same as `steamMode`, and not a field the C++
                      publishes -- an addition. See
                      docs/rust-migration/intentional-diffs.md #21.
                  shotsSinceBackflush:
                    type: integer
                  backflushReminderThreshold:
                    type: integer
                  backflushReminderDue:
                    type: boolean

  /api/maintenance/reset-backflush-counter:
    post:
      tags: [Maintenance]
      summary: Reset shots-since-backflush counter
      responses:
        "200":
          description: Counter reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  shotsSinceBackflush:
                    type: integer
                  backflushReminderDue:
                    type: boolean

  /api/health:
    get:
      tags: [Status]
      summary: Health check endpoint
      responses:
        "200":
          description: Service healthy

  /api/temperatures:
    get:
      tags: [Status]
      summary: Get temperature history
      responses:
        "200":
          description: Temperature data
          content:
            application/json:
              schema:
                type: object
                properties:
                  heaterPowers:
                    type: array
                    items:
                      type: number
                  heaterTemps:
                    type: array
                    items:
                      type: number
                  ambientTemp:
                    type: number

  /api/history:
    get:
      tags: [Status]
      summary: Get brewing history
      responses:
        "200":
          description: Brew history data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  # =============================================================================
  # Scale
  # =============================================================================

  /api/scale/tare:
    post:
      tags: [Scale]
      summary: Tare scale
      responses:
        "200":
          description: Scale tared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/scale/calibration:
    post:
      tags: [Scale]
      summary: Start scale calibration
      description: |
        NOTE: /api/scale/calibrate is deprecated, use this endpoint.
      responses:
        "200":
          description: Calibration started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # =============================================================================
  # OTA
  # =============================================================================

  /api/ota/status:
    get:
      tags: [OTA]
      summary: Get OTA update status
      responses:
        "200":
          description: OTA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [idle, downloading, uploading, processing, complete, error]
                  progress:
                    type: number
                  updateInProgress:
                    type: boolean
                  message:
                    type: string
                  error:
                    type: string

  /api/ota/firmware:
    post:
      tags: [OTA]
      summary: Upload firmware update
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firmware:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/ota/filesystem:
    post:
      tags: [OTA]
      summary: Upload filesystem update
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                filesystem:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/ota/url:
    post:
      tags: [OTA]
      summary: Update firmware or filesystem from URL
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                type:
                  type: string
                  enum: [firmware, filesystem]
                  default: firmware
      responses:
        "200":
          description: Download started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  # =============================================================================
  # System
  # =============================================================================

  /api/restart:
    post:
      tags: [System]
      summary: Restart the device
      responses:
        "200":
          description: Restart initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/factory-reset:
    post:
      tags: [System]
      summary: Factory reset (clear NVS)
      responses:
        "200":
          description: Reset initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/wifi-reset:
    post:
      tags: [System]
      summary: Reset WiFi settings
      responses:
        "200":
          description: WiFi reset initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/nvs-debug:
    get:
      tags: [System]
      summary: Debug NVS storage (development only)
      description: |
        Security concern: Exposes internal NVS keys.
        Consider gating behind build flag for production.
      responses:
        "200":
          description: NVS debug data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # =============================================================================
  # Power management
  # =============================================================================
  #
  # Both of these carry a DELIBERATE divergence from the C++ firmware, and that
  # is why they were missing from this spec until now: a reference that silently
  # omits the endpoints where the firmware misbehaves by design is worse than no
  # reference. See `docs/history/divergences.md`.

  /api/sleep:
    post:
      tags: [Machine]
      summary: Enter standby
      description: |
        Transitions the machine to `PID_DISABLED` with the heater off, then to
        `STANDBY`.

        DIVERGES from the C++ firmware. This firmware honours the request with
        the PID explicitly disabled; the C++ read no field at all and treated the
        call as a pure toggle. Recorded in `docs/history/divergences.md`.
      responses:
        "200":
          description: Sleep accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  state:
                    type: string

  /api/wake:
    post:
      tags: [Machine]
      summary: Leave standby
      description: Returns the machine to `PID_NORMAL` with the PID enabled.
      responses:
        "200":
          description: Wake accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  state:
                    type: string

  # =============================================================================
  # Event stream
  # =============================================================================

  /events:
    get:
      tags: [Status]
      summary: Server-sent event stream
      description: |
        A long-lived `text/event-stream` of telemetry frames. The consumer is a
        browser `EventSource`, so there is no request body and no response
        envelope: each message is one SSE frame.

        This is the endpoint that starves if a display frame is written one I2C
        transaction per pixel row, because it shares the bus with the panel.
      responses:
        "200":
          description: The event stream (never completes)
          content:
            text/event-stream:
              schema:
                type: string

  # =============================================================================
  # Web UI
  # =============================================================================

  /:
    get:
      tags: [System]
      summary: The web UI
      description: |
        Serves the embedded single-page application from flash. The bundle costs
        0 bytes of RAM; it is a gzipped asset embedded with `include_bytes!`.
      responses:
        "200":
          description: The UI's index document

components:
  # `system.auth.*` is implemented (see intentional-diffs.md #20). Every route
  # except `OPTIONS` is behind it, including `/` and `/ui*`, so the browser
  # raises its credential prompt on a top-level navigation.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Realm `CleverCoffee` (`WebServerManager.cpp:286`). Only consulted when
        `system.auth.enabled` is set AND both credentials are non-empty -- the
        C++'s exact condition, reproduced: empty credentials mean no
        authentication at all. Enabling it takes effect at the next boot, and a
        `POST /api/parameters` that changes it answers with
        `requiresRebootKeys`. Not TLS: the credential crosses the wire base64
        encoded.
  responses:
    Unauthorized:
      description: |
        Credentials absent or wrong. The `WWW-Authenticate` header carries the
        realm.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Basic realm="CleverCoffee"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
  # Nested machine configuration (seed file, download, upload, GET /api/config).
  # Parameter logical IDs remain dotted (e.g. brew.setpoint) but JSON uses nested objects.
    ConfigFile:
      type: object
      description: |
        Full machine configuration. Top-level keys group related settings.
        Import/export and LittleFS seed (`/config.json`) use this format only.
      additionalProperties: true
      properties:
        backflush:
          type: object
          additionalProperties: true
        brew:
          type: object
          additionalProperties: true
        display:
          type: object
          additionalProperties: true
        hardware:
          type: object
          additionalProperties: true
        maintenance:
          type: object
          additionalProperties: true
        mqtt:
          type: object
          additionalProperties: true
        pid:
          type: object
          additionalProperties: true
        standby:
          type: object
          additionalProperties: true
        steam:
          type: object
          additionalProperties: true
        system:
          type: object
          additionalProperties: true
          properties:
            hostname:
              type: string
            wifi:
              type: object
              properties:
                ssid:
                  type: string
                password:
                  type: string
            auth:
              type: object
              additionalProperties: true
      example:
        system:
          hostname: test-cc-rust
          wifi:
            ssid: my-network
            password: secret
        brew:
          setpoint: 95
        pid:
          enabled: true

    # Common schemas for reuse
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    # `sendConfigUploadResponse` (WebServerManager.cpp:50-62), verbatim.
    ConfigUploadResponse:
      type: object
      required: [success, message, restart]
      properties:
        success:
          type: boolean
        message:
          type: string
        restart:
          type: boolean
          description: Mirrors `success`. The device never reboots itself.

    StatusResponse:
      type: object
      properties:
        brewSwitch:
          type: boolean
        steamSwitch:
          type: boolean
        pumpSwitch:
          type: boolean
        setpoint:
          type: number
        currentTemp:
          type: number
        heaterPower:
          type: number
        pidEnabled:
          type: boolean
