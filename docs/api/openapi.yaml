# CleverCoffee ESP32 API Specification
# Shared contract between backend (C++) and frontend (React)
# Version: 1.0.0

openapi: 3.0.3
info:
  title: CleverCoffee API
  description: REST API for ESP32 coffee machine controller
  version: 1.0.0
  contact:
    name: CleverCoffee Project

servers:
  - url: http://clevercoffee.local
    description: Default ESP32 server
  - url: /
    description: Development (use VITE_SERVER_ENDPOINT)

tags:
  - name: Machine
    description: Machine control endpoints
  - name: Config
    description: Configuration management
  - name: Status
    description: Status and telemetry
  - name: Scale
    description: Scale control
  - name: OTA
    description: Over-the-air updates
  - name: System
    description: System operations

paths:
  # =============================================================================
  # Machine Control
  # =============================================================================

  /api/steam:
    post:
      tags: [Machine]
      summary: Toggle steam mode
      responses:
        "200":
          description: Steam mode toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  steamEnabled:
                    type: boolean

  /api/pid:
    post:
      tags: [Machine]
      summary: Toggle PID control
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: PID state changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  pidEnabled:
                    type: boolean

  /api/backflush:
    post:
      tags: [Machine]
      summary: Start backflush cycle
      responses:
        "200":
          description: Backflush started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/setpoint:
    post:
      tags: [Machine]
      summary: Set target temperature
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: number
                  format: double
      responses:
        "200":
          description: Setpoint updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # =============================================================================
  # Configuration
  # =============================================================================

  /api/config:
    get:
      tags: [Config]
      summary: Get current configuration
      responses:
        "200":
          description: Configuration object
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Config]
      summary: Update configuration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Config updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/config/download:
    get:
      tags: [Config]
      summary: Download full config as JSON file
      responses:
        "200":
          description: Config file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /api/parameters:
    get:
      tags: [Config]
      summary: Get parameter definitions
      parameters:
        - name: filter
          in: query
          schema:
            type: string
            enum: [all, visible, editable]
      responses:
        "200":
          description: Parameter definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                    min:
                      type: number
                    max:
                      type: number
                    defaultValue:
                      type: number
                    value:
                      type: number
                    visible:
                      type: boolean
    post:
      tags: [Config]
      summary: Update parameter value
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                value:
                  type: number
      responses:
        "200":
          description: Parameter updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/parameter-help:
    get:
      tags: [Config]
      summary: Get parameter metadata/help text
      responses:
        "200":
          description: Parameter help data
          content:
            application/json:
              schema:
                type: array

  # =============================================================================
  # Status & Telemetry
  # =============================================================================

  /api/status:
    get:
      tags: [Status]
      summary: Get machine status
      responses:
        "200":
          description: Current machine state
          content:
            application/json:
              schema:
                type: object
                properties:
                  brewSwitch:
                    type: boolean
                  steamSwitch:
                    type: boolean
                  pumpSwitch:
                    type: boolean
                  setpoint:
                    type: number
                  currentTemp:
                    type: number
                  heaterPower:
                    type: number
                  pidEnabled:
                    type: boolean

  /api/health:
    get:
      tags: [Status]
      summary: Health check endpoint
      responses:
        "200":
          description: Service healthy

  /api/temperatures:
    get:
      tags: [Status]
      summary: Get temperature history
      responses:
        "200":
          description: Temperature data
          content:
            application/json:
              schema:
                type: object
                properties:
                  heaterPowers:
                    type: array
                    items:
                      type: number
                  heaterTemps:
                    type: array
                    items:
                      type: number
                  ambientTemp:
                    type: number

  /api/history:
    get:
      tags: [Status]
      summary: Get brewing history
      responses:
        "200":
          description: Brew history data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object

  # =============================================================================
  # Scale
  # =============================================================================

  /api/scale/tare:
    post:
      tags: [Scale]
      summary: Tare scale
      responses:
        "200":
          description: Scale tared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/scale/calibration:
    post:
      tags: [Scale]
      summary: Start scale calibration
      description: |
        NOTE: /api/scale/calibrate is deprecated, use this endpoint.
      responses:
        "200":
          description: Calibration started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # =============================================================================
  # OTA
  # =============================================================================

  /api/ota/status:
    get:
      tags: [OTA]
      summary: Get OTA update status
      responses:
        "200":
          description: OTA status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [idle, downloading, uploading, processing, complete, error]
                  progress:
                    type: number
                  updateInProgress:
                    type: boolean
                  message:
                    type: string
                  error:
                    type: string

  /api/ota/firmware:
    post:
      tags: [OTA]
      summary: Upload firmware update
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firmware:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/ota/filesystem:
    post:
      tags: [OTA]
      summary: Upload filesystem update
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                filesystem:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/ota/url:
    post:
      tags: [OTA]
      summary: Update firmware from URL
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                url:
                  type: string
      responses:
        "200":
          description: Download started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  # =============================================================================
  # System
  # =============================================================================

  /api/restart:
    post:
      tags: [System]
      summary: Restart the device
      responses:
        "200":
          description: Restart initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/factory-reset:
    post:
      tags: [System]
      summary: Factory reset (clear NVS)
      responses:
        "200":
          description: Reset initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/wifi-reset:
    post:
      tags: [System]
      summary: Reset WiFi settings
      responses:
        "200":
          description: WiFi reset initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/nvs-debug:
    get:
      tags: [System]
      summary: Debug NVS storage (development only)
      description: |
        Security concern: Exposes internal NVS keys.
        Consider gating behind build flag for production.
      responses:
        "200":
          description: NVS debug data
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

components:
  schemas:
    # Common schemas for reuse
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    StatusResponse:
      type: object
      properties:
        brewSwitch:
          type: boolean
        steamSwitch:
          type: boolean
        pumpSwitch:
          type: boolean
        setpoint:
          type: number
        currentTemp:
          type: number
        heaterPower:
          type: number
        pidEnabled:
          type: boolean