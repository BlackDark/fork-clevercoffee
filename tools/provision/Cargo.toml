[package]
name = "provision"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "provision"
path = "src/main.rs"

[lib]
name = "provision"
path = "src/lib.rs"

[dependencies]
serialport = { version = "4.10", default-features = false }
base64 = "0.22"
crc32fast = "1"

[profile.release]
lto = "fat"
codegen-units = 1
