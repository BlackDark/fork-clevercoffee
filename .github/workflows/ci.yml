# Header from BlackDark/agent-presets snippets/ci.yml. Three parallel jobs instead of one
# `mise run check`: host (stable Rust), ui (pnpm), firmware (Xtensa, needs the UI build).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      version:
        description: Version shown in the web UI; default is the ref name
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just host-check

  ui:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: just node pnpm
      - run: just ui-check
      - run: just ui
        env:
          VITE_APP_VERSION: ${{ inputs.version || github.ref_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: ui/packages/frontend/dist
          retention-days: 7

  firmware:
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: just github:esp-rs/espup github:esp-rs/espflash
      - name: Read the Xtensa toolchain version
        run: echo "ESP_TOOLCHAIN=$(just --evaluate esp_toolchain)" >> "$GITHUB_ENV"
      - name: Cache Xtensa toolchain
        id: esp-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/esp
            firmware/.esp-env.sh
          key: esp-${{ runner.os }}-${{ env.ESP_TOOLCHAIN }}
      - name: Install Xtensa toolchain
        if: steps.esp-cache.outputs.cache-hit != 'true'
        run: just esp-toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: firmware
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/packages/frontend/dist
      - run: just firmware-lint
      - run: just size standard
      - run: just size full
      - run: just size minimal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: target/app-*.bin
          retention-days: 14

  # The one check the main ruleset requires. Skipped jobs (draft PRs) count as passed.
  check:
    if: always()
    needs: [host, ui, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
