name: Rust firmware

# ===========================================================================
# THE RUST FIRMWARE.
#
# Before this file existed, `.github/workflows/` contained zero references to
# `cargo` or `just`: main.yml and release.yml ran PlatformIO, format.yml ran
# clang-format, frontend.yml ran pnpm. So 68,530 lines of new firmware and
# 13,563 lines of Rust tests were merged with **no automated verification at
# all**, and `just gate` was invoked by nothing. CI was green purely because the
# untouched C++ tree still compiled. REVIEW.md H-1.
#
# `main.yml` still builds and tests the C++ — it is the parity oracle, and it
# is what `release.yml` publishes. The two are not alternatives; both gates
# have to be green.
#
# TWO TOOLCHAIN CHANNELS, ON PURPOSE
# -----------------------------------
# `rust-toolchain.toml` pins `channel = "esp"` — an Espressif nightly fork that
# only `espup` installs. The `host` job below therefore runs on **stable**, via
# `CC_RUST_TOOLCHAIN=stable`, and the `device` job on **esp**.
#
# The reason is not speed. It is that a runner with only GitHub's stock Rust
# cannot run `just` AT ALL: `host_target` is derived from a backtick, just
# evaluates backticks while PARSING the justfile, and a failing backtick is a
# parse error — so `rustc -vV` failing to resolve `esp` takes down every recipe
# in the job with a message that never mentions the toolchain. That is how the
# first version of this workflow failed.
#
# So: the host gate compiles the portable crates (`cc-domain`, `cc-safety`,
# `cc-config`, `cc-machine`, `cc-display` — all `#![no_std]`, all host-testable)
# on a stock toolchain, which is also what makes the workspace's
# `rust-version = "1.82"` claim verifiable instead of decorative. The device gate
# compiles the firmware on the pinned Xtensa fork.
#
# The device build also needs a compiled ESP-IDF (via embuild). `just setup`
# handles it; the Xtensa jobs below are the ones that would otherwise be silently
# unverified, and they are exactly the ones that cannot be skipped "because it
# needs a board" — only `just test-esp32` needs a board.
# ===========================================================================

on:
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".mise.toml"
      - "justfile"
      - "just/**"
      - "scripts/**"
      - "ui/**"
      - ".github/workflows/rust.yml"
      - "components_esp32.lock"
      - "rust/**"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".mise.toml"
      - "justfile"
      - "just/**"
      - "scripts/**"
      - "ui/**"
      - ".github/workflows/rust.yml"
      - "components_esp32.lock"
      - "rust/**"

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Single source of truth, asserted by `just doctor` against
  # `components_esp32.lock`. If these two drift, a "works on CI" build happens.
  ESP_IDF_VERSION: "v5.5.5"
  RUSTFLAGS: "--cfg espidf_time64"
  ESP_IDF_SYS_ROOT_CRATE: "cc-firmware"
  # Every recipe passes `--target {{host_target}}` explicitly, so this is only a
  # safety net for a bare `cargo` invocation inside a recipe.
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------- host gates
  #
  # No hardware, no ESP-IDF, no device toolchain. This is the job that has to be
  # green for a change to be mergeable, and it is fast.
  host:
    name: format, lint, doc, test (host)
    runs-on: ubuntu-latest
    # STABLE, deliberately, and not for speed -- see the header.
    #
    # `CC_RUST_TOOLCHAIN` is the switch the justfile exposes; `RUSTUP_TOOLCHAIN`
    # is set too so a bare `cargo` in this job resolves the same way a bare
    # `just` does. The justfile's own default stays `esp`.
    env:
      CC_RUST_TOOLCHAIN: stable
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          # The Espressif `esp` toolchain is NOT needed here, and installing it
          # costs minutes per job. `rust-toolchain.toml` is the compiler pin;
          # mise deliberately does not own the compiler (see its header).
          install: true
          experimental: true

      - name: Show the resolved toolchain
        run: |
          rustc --version
          cargo --version
          echo "host triple: $(just --evaluate host_target)"

      - name: Host checks (no device toolchain required)
        # `doctor-host`, not `doctor`: `doctor` asserts the DEVICE toolchain — the
        # esp channel and a Xtensa GCC — and a host job has no business
        # downloading one. `doctor-host` checks everything a host-only job can
        # actually assert: the host triple resolved, the ESP-IDF pin still
        # matches components_esp32.lock, and mise still does not claim to own
        # the compiler.
        run: just doctor-host

      - name: cargo fmt
        run: just fmt-check

      - name: clippy (host, pedantic, -D warnings)
        run: just lint

      - name: rustdoc, warnings as errors
        run: just doc

      - name: Host tests
        run: just test

      - name: Parity harness tests
        run: just parity-test

      - name: The device-test registry audit
        # Fails if any device-crate `#[test]` exists that the on-target runner
        # cannot execute. This is the guard against "147 tests that never ran",
        # and it needs no hardware and no cargo.
        run: just test-audit

      - name: The web UI lints, typechecks, tests and builds
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm --filter @clevercoffee/frontend tsc
          pnpm --filter @clevercoffee/frontend test:run
          pnpm --filter @clevercoffee/frontend build

  # ------------------------------------------------------------- device gates
  #
  # The Xtensa build. `just setup` installs the Espressif toolchain via espup and
  # ESP-IDF via embuild; that is slow but it is the only way the firmware this
  # branch exists to produce is ever compiled before a merge.
  device:
    name: clippy + firmware build + size budget (xtensa-esp32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          experimental: true

      # Free space. The ESP-IDF clone embuild drives is several GB, and the
      # default ubuntu runner has ~14 GB free. This job fails on disk otherwise,
      # which looks nothing like a code failure.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install the Espressif Xtensa toolchain and ESP-IDF
        # `espup` is a NORMAL cargo install, and `rust-toolchain.toml` says
        # `channel = "esp"` — which does not exist yet, precisely because espup is
        # what installs it. So the bootstrap has to run on a toolchain that IS
        # present: without `CC_RUST_TOOLCHAIN=stable` here, the very first
        # `cargo install` fails with "custom toolchain 'esp' is not installed" and
        # the device job dies before it starts.
        #
        # Every LATER step gets `esp` from `rust-toolchain.toml`, which is what
        # the justfile's default (`RUSTUP_TOOLCHAIN := esp`) expects. The
        # concrete version is pinned in `.mise.toml` as
        # `x86_64_toolchain_version`; the `esp` rustup channel is FLOATING, so
        # that pin is the only version pin there is, and `just doctor` checks it.
        env:
          CC_RUST_TOOLCHAIN: stable
        run: |
          mise trust
          mise install
          mise run setup-esp
          unset CC_RUST_TOOLCHAIN
          just doctor

      - name: clippy (device, pedantic, -D warnings)
        run: just lint-esp32

      - name: Build the firmware
        run: just build-esp32

      - name: Image size is within budget
        run: just size-check

      - name: Record the image size as an artefact
        # So a size regression is a visible diff in the PR, not something a human
        # has to go and look for.
        run: |
          just size-record esp32 ci
          cat docs/rust-migration/size-records.jsonl | tail -1

  # ---------------------------------------------------------------- invariants
  #
  # Cheap greps that encode rules this workspace depends on and that a compiler
  # cannot check across crate boundaries.
  invariants:
    name: workspace invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the Espressif toolchain (for the lint-name probe)
        # `scripts/lint-names.py` checks every lint this workspace names against
        # BOTH channels it supports, because `unknown_lints = "allow"` in
        # Cargo.toml is only safe while something catches a name that exists on
        # NEITHER. The probe is only as good as the channels it can reach, so a
        # missing channel is a hard error in the script rather than a skip.
        env:
          CC_RUST_TOOLCHAIN: stable
        run: |
          # The SAME pin `mise run setup-esp` uses, read from the one place it is
          # written. `rustup toolchain install esp` would take the FLOATING
          # channel, which is a different toolchain from the one the device job
          # lints against -- and a lint-name check against the wrong esp build
          # proves nothing.
          version=$(sed -n 's/^x86_64_toolchain_version = "\(.*\)"/\1/p' .mise.toml)
          echo "esp toolchain version: ${version}"
          rustup toolchain install "esp-${version}" --profile minimal --component clippy,rustfmt
          rustup toolchain link esp "esp-${version}"
          rustup toolchain list

      - name: Every lint named in an allow/expect is a real lint
        # `Cargo.toml` sets `unknown_lints = "allow"`, because this repository runs
        # clippy on two generations at once (the runner's `stable` and the
        # Espressif `esp` 1.97 fork) and every recipe passes `-D warnings`, which
        # promotes `unknown_lints` to an error. Without the allowance, one
        # suppression naming a lint the older channel predates takes the whole
        # build down -- which is what broke PR #96.
        #
        # The cost of allowing it is that a typo in a suppression would go
        # unnoticed. This closes that hole: every lint named in an allow/expect
        # must exist on AT LEAST ONE channel, and the report names the ones that
        # exist on only one. A typo exists on neither and fails here.
        #
        # Both toolchains must be installed, which this job already guarantees.
        env:
          CC_LINT_CHANNELS: stable:esp
        run: python3 scripts/lint-names.py .

      - name: The portable crates must not name esp-idf in CODE
        # cc-domain, cc-safety, cc-config, cc-machine and cc-display are
        # `#![no_std]` and host-testable. An `esp_idf_*` import in any of them
        # breaks every host test and every IDE's background check, and it is
        # invisible until it does.
        #
        # A script, not a grep, because `rg 'esp_idf_(hal|svc|sys)'` fires on
        # PROSE -- and cc-domain/src/lib.rs line 11 is a doc comment saying
        # "this crate must never name esp_idf_svc". The first version of this
        # check failed on its own documentation. Comments and doc-comments are
        # stripped before the search, so a portable crate can still explain why
        # it does not use ESP-IDF.
        run: python3 scripts/portable-purity.py .

      - name: no blanket lint suppression
        # `#![allow(clippy::all)]` or a bare `-A warnings` hides a whole class of
        # defect, including the clippy this workflow exists to run.
        run: |
          if rg -n '#!\[allow\((clippy::)?(all|warnings)' crates/; then
            echo "::error::a blanket lint suppression crept in"
            exit 1
          fi
          echo "ok: no blanket lint suppression"

      - name: "Every `unsafe` site carries a written reason"
        # `unsafe_code = "deny"` workspace-wide. Every escape hatch must say why,
        # which is what makes the remaining `unsafe` reviewable.
        run: |
          python3 scripts/unsafe-audit.py .

      - name: Third-party licence notices are present
        # U8g2 is BSD-2-Clause and its font streams are redistributed verbatim in
        # crates/cc-display/src/font/data.rs. Clause 3 of the licence requires
        # the notice to travel with the redistribution.
        run: |
          grep -q 'THIRD-PARTY NOTICE' crates/cc-display/src/font/data.rs
          test -f docs/THIRD_PARTY_LICENSES.md
          echo "ok: U8g2 notice present in data.rs and in docs/THIRD_PARTY_LICENSES.md"
