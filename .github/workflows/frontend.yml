name: Frontend

on:
  workflow_call:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    # pnpm install/lint/tsc/test/build; measured 25 s.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # zizmor: the checkout token is written to .git/config and is then
          # readable by anything that runs in this job. Nothing here pushes,
          # tags or creates releases, so it does not need to persist.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        working-directory: ui
        run: pnpm lint

      - name: Type check
        working-directory: ui/packages/frontend
        run: pnpm tsc

      - name: Test
        working-directory: ui/packages/frontend
        run: pnpm test:run

      - name: Build
        working-directory: ui/packages/frontend
        run: pnpm build
