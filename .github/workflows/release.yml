name: Release

# ---------------------------------------------------------------------------
# THIS WORKFLOW BUILDS THE **C++** FIRMWARE. IT IS NOT THE RUST FIRMWARE.
#
# Every step below is PlatformIO (`pio run`, `pio run --target buildfs`). The
# Rust workspace in `crates/` is built by `rust.yml`, which does not publish
# anything.
#
# WHY THE BRANCH GUARD: `on.push.tags` alone means a `v*` tag pushed from ANY
# branch fires this workflow. Before the guard below, tagging the Rust port
# branch `v2.0.0` would have built the untouched C++ tree (which still
# compiles — `git diff --stat main -- src include lib` is empty), staged its
# `firmware.bin` plus a `littlefs.bin` intended for offset 0x350000, and
# published all four under the CleverCoffee name. `rust/partitions_4M.csv`
# puts `littlefs` at 0x390000 and has no region at 0x350000, so the release
# notes would have told every user to flash an image at an address their
# Rust-partitioned flash does not have. `fail_on_unmatched_files` does not
# help: the C++ build produces all four files, so the upload succeeds.
#
# The C++ image remains the published artifact while it is the production
# firmware. When the Rust image becomes the product, this workflow is
# replaced, not merely unlocked.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The guard. A `v*` tag carries no branch name, so `on.push.tags` alone
  # cannot tell a release cut from `main` from one cut from any other branch.
  # This proves the tagged commit is actually reachable from `origin/main`
  # before anything is built or published. It is cheap, and it is the only
  # thing standing between a mistagged branch and a published C++ image.
  guard:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the ancestry check needs the main-line commits.
          fetch-depth: 0

      - id: check
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME is on main -- allowed"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag $GITHUB_REF_NAME is NOT reachable from origin/main."
            echo "This workflow builds the C++ firmware with PlatformIO."
            echo "Tagging a non-main branch would publish the C++ image under"
            echo "the CleverCoffee name, with release notes pointing"
            echo "littlefs.bin at 0x350000 -- an address that does not exist in"
            echo "rust/partitions_4M.csv."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.platformio/.cache
            .pio/buildcache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'platformio_extra.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -r .github/requirements-ci.txt

      - name: Set CLEVERCOFFEE_VERSION
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "CLEVERCOFFEE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Run native tests
        run: pio test -e native_test

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build firmware
        run: pio run -e esp32_usb
        env:
          CLEVERCOFFEE_VERSION: ${{ env.CLEVERCOFFEE_VERSION }}
          PLATFORMIO_BUILD_FLAGS: '-D VERSION=\"${{ env.CLEVERCOFFEE_VERSION }}\"'

      - name: Build filesystem
        run: pio run --target buildfs -e esp32_usb
        env:
          CLEVERCOFFEE_VERSION: ${{ env.CLEVERCOFFEE_VERSION }}
          PLATFORMIO_BUILD_FLAGS: '-D VERSION=\"${{ env.CLEVERCOFFEE_VERSION }}\"'

      - name: Stage release artifacts
        run: |
          mkdir -p release-artifacts
          for file in firmware.bin littlefs.bin bootloader.bin partitions.bin; do
            cp ".pio/build/esp32_usb/${file}" "release-artifacts/${file}"
          done
          ls -la release-artifacts/

      - name: Verify release artifacts
        run: |
          for file in firmware.bin littlefs.bin bootloader.bin partitions.bin; do
            test -f "release-artifacts/${file}" || {
              echo "Missing release artifact: ${file}"
              exit 1
            }
          done

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          printf '%s\n' \
            "## CleverCoffee ${TAG}" \
            "" \
            "### OTA updates (web UI)" \
            "" \
            "Open **System → OTA Updates** on the device and use these direct download URLs:" \
            "" \
            "| File | Purpose | URL |" \
            "|------|---------|-----|" \
            "| \`firmware.bin\` | Application firmware | [Download](${BASE}/firmware.bin) |" \
            "| \`littlefs.bin\` | Web UI filesystem | [Download](${BASE}/littlefs.bin) |" \
            "" \
            "Direct links:" \
            "" \
            "- Firmware: \`${BASE}/firmware.bin\`" \
            "- Filesystem: \`${BASE}/littlefs.bin\`" \
            "" \
            "### USB flash (initial install or recovery)" \
            "" \
            "Flash all four files with the ESP Flash Download Tool or \`esptool.py\`:" \
            "" \
            "| File | Flash address | Purpose |" \
            "|------|---------------|---------|" \
            "| \`bootloader.bin\` | \`0x1000\` | ESP32 bootloader |" \
            "| \`partitions.bin\` | \`0x8000\` | Partition table |" \
            "| \`firmware.bin\` | \`0x10000\` | Application |" \
            "| \`littlefs.bin\` | \`0x350000\` | Filesystem (web UI) |" \
            "" \
            "Merge into a single image:" \
            "" \
            '```bash' \
            "esptool.py --chip esp32 merge_bin -o merged-flash.bin \\" \
            "  --flash_mode dio --flash_size 4MB \\" \
            "  0x1000 bootloader.bin \\" \
            "  0x8000 partitions.bin \\" \
            "  0x10000 firmware.bin \\" \
            "  0x350000 littlefs.bin" \
            '```' \
            "" \
            "Flash settings: SPI speed 40 MHz, SPI mode DIO, flash size 4 MB." \
            > release_notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: CleverCoffee ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release-artifacts/firmware.bin
            release-artifacts/littlefs.bin
            release-artifacts/bootloader.bin
            release-artifacts/partitions.bin
          fail_on_unmatched_files: true
