# Tag v* → CI, then merged USB images and OTA images for every profile on a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ESP_TOOLCHAIN: "1.99.0.0"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: just espup espflash
      - uses: actions/cache@v4
        id: esp-cache
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/export-esp.sh
          key: esp-${{ runner.os }}-${{ env.ESP_TOOLCHAIN }}
      - if: steps.esp-cache.outputs.cache-hit != 'true'
        run: espup install --targets esp32 --toolchain-version "$ESP_TOOLCHAIN" --skip-version-parse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/packages/frontend/dist
      - name: Images
        run: |
          for p in minimal standard full; do
            just size "$p"
            just image "$p"
          done
          ls -l target/*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: release-images
          path: |
            target/clevercoffee-*.bin
            target/app-*.bin

  publish:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-images
          path: images
      - uses: softprops/action-gh-release@v2
        with:
          name: CleverCoffee ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            | File | Use |
            | --- | --- |
            | `clevercoffee-<profile>.bin` | First install over USB: `espflash write-bin --chip esp32 0x0 clevercoffee-standard.bin` |
            | `app-<profile>.bin` | Update from the web UI (System → Firmware Update) |

            Profiles: `minimal`, `standard` (MQTT + display), `full` (+ scales, pressure sensor). See docs/firmware.md.
          files: |
            images/clevercoffee-*.bin
            images/app-*.bin
