# Tag v* → CI, then merged USB images and OTA images for every profile on a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: $/.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ESP_TOOLCHAIN: "1.99.0.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install_args: just github:esp-rs/espup github:esp-rs/espflash
          cache: false
      # Restore only: a release must not write caches; CI saves this key.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: esp-cache
        with:
          path: |
            ~/.rustup/toolchains/esp
            firmware/.esp-env.sh
          key: esp-${{ runner.os }}-${{ env.ESP_TOOLCHAIN }}
      - if: steps.esp-cache.outputs.cache-hit != 'true'
        run: espup install --targets esp32 --toolchain-version "$ESP_TOOLCHAIN" --skip-version-parse --export-file firmware/.esp-env.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ui-dist
          path: ui/packages/frontend/dist
      - name: Images
        run: |
          for p in minimal standard full; do
            just size "$p"
            just image "$p"
          done
          ls -l target/*.bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-images
          path: |
            target/clevercoffee-*.bin
            target/app-*.bin

  publish:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-images
          path: images
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s failglob
          cat > notes.md <<'NOTES'
          | File | Use |
          | --- | --- |
          | `clevercoffee-<profile>.bin` | First install over USB: `espflash write-bin --chip esp32 0x0 clevercoffee-standard.bin` |
          | `app-<profile>.bin` | Update from the web UI (System → Firmware Update) |

          Profiles: `minimal`, `standard` (MQTT + display), `full` (+ scales, pressure sensor). See docs/firmware.md.
          NOTES
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "CleverCoffee $TAG" --generate-notes --notes-file notes.md \
            images/clevercoffee-*.bin images/app-*.bin
