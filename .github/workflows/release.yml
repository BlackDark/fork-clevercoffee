name: Release

# ---------------------------------------------------------------------------
# THIS WORKFLOW BUILDS THE **RUST** FIRMWARE.
#
# It replaced a PlatformIO pipeline that published the C++ image.
# First tag: `v2.0.0-alpha.1` (2026-10-09, run 37925778055). The
# published `firmware.bin` passed the 4 MB merge check. That file has
# not been flashed from the release asset onto the board.
#
# WHY THE BRANCH GUARD. `on.push.tags` alone means a `v*` tag pushed from ANY
# branch fires this workflow, so the tagged commit must be proved reachable from
# `origin/main` before anything is built or published. Cheap, and it is the only
# thing standing between a topic branch and the CleverCoffee release name.
#
# WHY ONE ARTIFACT. `espflash save-image --merge` folds the bootloader, the
# partition table and the application into a single full-flash image, which is
# what `esptool write_flash` wants at offset 0 and what the ESP Flash Download
# Tool wants with no offset column. Publishing a bare `firmware.bin` and a note
# telling someone which offsets to use is the alternative, and it is the
# alternative the C++ pipeline used, with the result that its release notes
# pointed at 0x350000 -- an address the Rust partition table does not have.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The guard. A `v*` tag carries no branch name, so `on.push.tags` alone
  # cannot tell a release cut from `main` from one cut from any other branch.
  guard:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the ancestry check needs the main-line commits.
          fetch-depth: 0
          persist-credentials: false

      - id: check
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME is on main -- allowed"
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::tag $GITHUB_REF_NAME is NOT reachable from origin/main."
            echo "This workflow publishes the Rust image under the CleverCoffee"
            echo "name. Tagging a topic branch would publish an unreleased build."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    # The ESP-IDF build is the cost here; 60 min leaves headroom without letting
    # a wedged espup bill for hours.
    timeout-minutes: 60
    # Same reason as `rust.yml`'s device job: mise-action runs `mise install`,
    # and a bare `cargo install` from one of its `cargo:` backends would resolve
    # through `rust-toolchain.toml` and demand the `esp` channel.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: true
          experimental: true

      # Same reasoning as `rust.yml`: the ESP-IDF clone embuild drives is
      # several GB, and a build job that dies of ENOSPC looks exactly like a
      # code failure.
      - name: Ensure enough free disk
        run: |
          set -euo pipefail
          avail_kb=$(df --output=avail / | tail -1)
          avail_gb=$(( avail_kb / 1024 / 1024 ))
          echo "free disk: ${avail_gb}G"
          if [ "$avail_gb" -lt 30 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
            freed_kb=$(df --output=avail / | tail -1)
            echo "free disk now: $(( freed_kb / 1024 / 1024 ))G"
          fi

      - name: Install the Espressif Xtensa toolchain and ESP-IDF
        run: |
          set -euxo pipefail
          mise trust
          mise install
          ./scripts/setup-esp-toolchain.sh
          just env-file
          just doctor

      # `cc-hal-esp32/build.rs` panics without `ui/packages/frontend/dist`, so
      # the UI is not optional here (AG-RUST-6).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Build the web UI
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @clevercoffee/frontend build

      - name: Build the firmware
        run: just build-esp32

      - name: Merge the image
        # `--merge` folds bootloader + partition table + application into one
        # full-flash image at their real offsets. `espflash` reads the partition
        # table out of the ESP-IDF metadata cargo embedded in the ELF, so this
        # cannot silently use a different table than the firmware was built with.
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          espflash save-image \
            --chip esp32 \
            --flash-size 4mb \
            --flash-freq 40mhz \
            --flash-mode dio \
            --merge \
            target/xtensa-esp32-espidf/release/firmware \
            release-artifacts/firmware.bin
          ls -la release-artifacts/

      - name: Verify the release artifact
        run: |
          set -euo pipefail
          test -s release-artifacts/firmware.bin
          # A merged image is one full flash, so it must be close to 4 MB. A
          # short file means `--merge` silently produced a bare application.
          size=$(stat -c %s release-artifacts/firmware.bin)
          echo "firmware.bin: ${size} bytes"
          if [ "$size" -lt 3500000 ]; then
            echo "::error::firmware.bin is ${size} bytes; a merged 4 MB image is not."
            exit 1
          fi

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          printf '%s\n' \
            "## CleverCoffee ${TAG}" \
            "" \
            "### Flash it" \
            "" \
            "\`firmware.bin\` is a **merged full-flash image**: bootloader," \
            "partition table and application, already at their own offsets." \
            "" \
            "\`\`\`bash" \
            "esptool.py --chip esp32 write_flash 0x0 firmware.bin" \
            "\`\`\`" \
            "" \
            "or use the ESP Flash Download Tool with address \`0x0\`." \
            "" \
            "Flash settings: SPI speed 40 MHz, SPI mode DIO, flash size 4 MB." \
            "" \
            "Direct link: ${BASE}/firmware.bin" \
            "" \
            "### OTA updates (web UI)" \
            "" \
            "Open **System → OTA Updates** on the device and use the direct" \
            "download URL above. The upload path was exercised on hardware." \
            "See the repository's \`docs/status.md\`." \
            > release_notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: CleverCoffee ${{ github.ref_name }}
          body_path: release_notes.md
          files: release-artifacts/firmware.bin
