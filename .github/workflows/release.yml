# Called by release-please.yml with the tag it just created (or run by hand for an existing tag):
# CI on the tagged commit, then merged USB images and OTA images for every profile, attached to the
# GitHub release. release-please owns the tag, the changelog and the release itself.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag vX.Y.Z, already pushed
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag vX.Y.Z
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    with:
      version: ${{ inputs.tag }}

  images:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: just github:esp-rs/espup github:esp-rs/espflash
          cache: false
      - name: Read the Xtensa toolchain version
        run: echo "ESP_TOOLCHAIN=$(just --evaluate esp_toolchain)" >> "$GITHUB_ENV"
      # Restore only: a release must not write caches; CI saves this key.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: esp-cache
        with:
          path: |
            ~/.rustup/toolchains/esp
            firmware/.esp-env.sh
          key: esp-${{ runner.os }}-${{ env.ESP_TOOLCHAIN }}
      - if: steps.esp-cache.outputs.cache-hit != 'true'
        run: just esp-toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: ui/packages/frontend/dist
      - name: Images
        run: |
          for p in minimal standard full; do
            just size "$p"
            just image "$p"
          done
          ls -l target/*.bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images
          path: |
            target/clevercoffee-*.bin
            target/app-*.bin

  publish:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-images
          path: images
      - name: Attach the images to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s failglob
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            images/clevercoffee-*.bin images/app-*.bin
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          case "$notes" in *"First install over USB"*) exit 0 ;; esac
          cat > notes.md <<'NOTES'

          | File | Use |
          | --- | --- |
          | `clevercoffee-<profile>.bin` | First install over USB: `espflash write-bin --chip esp32 0x0 clevercoffee-standard.bin` |
          | `app-<profile>.bin` | Update from the web UI (System → Firmware Update) |

          Profiles: `minimal`, `standard` (MQTT + display), `full` (+ scales, pressure sensor). See docs/firmware.md.
          NOTES
          { printf '%s\n' "$notes"; cat notes.md; } > body.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
