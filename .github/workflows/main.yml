name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      clevercoffee_version: ${{ steps.version.outputs.clevercoffee_version }}
      artifact_slug: ${{ steps.version.outputs.artifact_slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inject slug env
        uses: rlespinasse/github-slug-action@0e3299190dac9a700da92a90de4556116ea965ed # v5
        with:
          short-length: 6

      - name: Set CLEVERCOFFEE_VERSION
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            ARTIFACT_SLUG="${GITHUB_REF_NAME_SLUG_URL}"
          else
            BRANCH_SLUG="${GITHUB_REF_POINT_SLUG:0:6}"
            SHA_SHORT="${GITHUB_SHA:0:6}"
            VERSION="dev-${BRANCH_SLUG}-${SHA_SHORT}"
            ARTIFACT_SLUG="${VERSION}"
          fi
          echo "clevercoffee_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "artifact_slug=${ARTIFACT_SLUG}" >> "${GITHUB_OUTPUT}"

  # THE C++ FIRMWARE -- the parity oracle, not the product yet.
  # `rust.yml` is the job that builds `crates/cc-firmware`. Both run on every
  # PR: the C++ build is the gate that the parity oracle still compiles, and it
  # is what `release.yml` publishes.
  firmware:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ONE env, not two.
        #
        # `env_name: [esp32_usb, esp32_ota]` was two FULL PlatformIO builds of
        # the same firmware -- 175 s and 142 s measured -- and they produce the
        # same bytes. `platformio.ini:60-71`: both `extends = esp32_v1_base`, and
        # the only differences are
        #
        #     monitor_port / upload_protocol / upload_port / upload_flags
        #
        # none of which affect codegen. Both jobs report
        # `Flash: 90.3% (used 1539333 bytes from 1703936 bytes)` -- identical --
        # and `release.yml` only ever builds `esp32_usb` (lines 114, 120, 129).
        # So the `esp32_ota` artifact was a second copy of a file nothing reads.
        #
        # `env:esp32_ota` is KEPT in `platformio.ini` on purpose: it is how a
        # developer flashes over the air locally (`pio run -e esp32_ota`). What
        # was removed is only the duplicate CI build.
        env_name: [esp32_usb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.platformio/.cache
            .pio/buildcache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'platformio_extra.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -r .github/requirements-ci.txt

      - name: Build firmware (${{ matrix.env_name }})
        run: pio run -e ${{ matrix.env_name }}
        env:
          CLEVERCOFFEE_VERSION: ${{ needs.version.outputs.clevercoffee_version }}
          PLATFORMIO_BUILD_FLAGS: '-D VERSION=\"${{ needs.version.outputs.clevercoffee_version }}\"'

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clevercoffee-firmware-${{ matrix.env_name }}-${{ needs.version.outputs.artifact_slug }}
          path: |
            .pio/build/${{ matrix.env_name }}/firmware.bin
            .pio/build/${{ matrix.env_name }}/partitions.bin
            .pio/build/${{ matrix.env_name }}/bootloader.bin
          retention-days: 3
          if-no-files-found: warn

  # The C++ native test suite (`pio test -e native_test`).
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.platformio/.cache
            .pio/build
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini', 'platformio_extra.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -r .github/requirements-ci.txt

      - name: Run native tests
        run: pio test -e native_test
