name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Inject slug env
        uses: rlespinasse/github-slug-action@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Set CLEVERCOFFEE_VERSION
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            ARTIFACT_SLUG="${GITHUB_REF_NAME_SLUG_URL}"
          else
            VERSION="4.x.x-${GITHUB_REF_POINT}"
            ARTIFACT_SLUG="4-x-x-${GITHUB_REF_POINT_SLUG_URL}"
          fi
          echo "CLEVERCOFFEE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${ARTIFACT_SLUG}" >> "${GITHUB_OUTPUT}"

      - name: Build firmware
        run: |
          pio run -e esp32_usb
          pio run -e esp32_ota
        env:
          CLEVERCOFFEE_VERSION: ${{ env.CLEVERCOFFEE_VERSION }}

      - name: Run native tests
        run: pio test -e native_test

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clevercoffee-firmware-${{ steps.version.outputs.version }}
          path: |
            .pio/build/*/firmware.bin
            .pio/build/*/partitions.bin
            .pio/build/*/bootloader.bin
          retention-days: 3
          if-no-files-found: warn
