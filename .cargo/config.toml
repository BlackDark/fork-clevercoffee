# CleverCoffee — Rust workspace cargo configuration.
#
# Keep the build knobs here in sync with the `justfile` module-level variables
# (05 §4) and the `firmware` CI job env (05 §6). `just doctor` asserts them.

[build]
# The production target. The original ESP32 is Xtensa LX6 — see skill §1 fact 1.
target = "xtensa-esp32-espidf"
# Must match RUSTFLAGS in the justfile. `--cfg espidf_time64` is what
# esp-idf-sys 0.38 looks for; without it the build silently uses 32-bit time_t
# and diverges from CI.
rustflags = ["--cfg", "espidf_time64"]

# The ESP-IDF link must go through `ldproxy`, which wraps the Xtensa `ld` and
# resolves the `--defsym`/`-T` script gymnastics of the ESP-IDF linker setup.
# `esp-idf-sys` emits `--ldproxy-linker`/`--ldproxy-cwd` as link args, so if the
# linker is the bare `xtensa-esp32-elf-gcc` the link dies with
# "unrecognized command-line option '--ldproxy-linker'".
# embuild detects this via `$RUSTC_LINKER` and only warns if it is missing, so
# the failure surfaces late. Scoped to the device triple: the host crates must
# still link with the system linker.
[target.xtensa-esp32-espidf]
linker = "ldproxy"

[unstable]
# The `esp` toolchain is a nightly fork, so this is available. On a stable host
# cargo this section is ignored with a warning (verified — see the R1-01 report).
build-std = ["std", "panic_abort"]
# std's `backtrace-trace-only` feature (upstream, "For use with -Zbuild-std").
# Cargo's build-std turns std's `backtrace` feature on by default, which makes
# the panic hook link the whole `addr2line`/`object` DWARF reader (gimli) so it
# can turn frame addresses into symbol names. The app image carries only its
# 256-byte descriptor, not a symbol table, so on the device that can only ever
# produce addresses. `backtrace-trace-only` makes
# `std::sys::backtrace::_print_fmt` walk the frames and print the raw PCs
# instead, which drops addr2line/object/miniz_oxide from the link. The PCs are
# resolved host-side with `just diag-addr2line`. 07-image-size-budget.md §9.
build-std-features = ["std/backtrace-trace-only"]

[idf]
# Relative to the workspace root. Deliberately NOT copied from the upstream
# esp-idf repo's partitions.csv, and deliberately NOT the C++
# partitions_4M.csv (which is 0x1A0000 per slot and would not hold a Rust image).
partition_table = "rust/partitions_4M.csv"
