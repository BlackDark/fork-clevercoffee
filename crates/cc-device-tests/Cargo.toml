[package]
name = "cc-device-tests"
description = "On-target unit test runner. Never flashed as the firmware."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# A separate crate, not a second `[[bin]]` of cc-firmware: the device crates'
# test modules are reachable only through their `device-tests` features, and a
# feature is package-wide, so a runner inside cc-firmware would enable it for the
# shipped binary too. There is no libtest on the ESP32: `main` is the runner and
# the cases come in through each crate's `device_tests::CASES`.
[[bin]]
name = "firmware-tests"
path = "src/main.rs"
test = false
bench = false
harness = false

[dependencies]
# `device-tests` turns `#[test] fn` into `pub fn` behind `device_tests::CASES`.
cc-hal-esp32 = { workspace = true, features = ["device-tests"] }
cc-net-esp32 = { workspace = true, features = ["device-tests"] }
esp-idf-hal.workspace = true
esp-idf-svc.workspace = true
log.workspace = true

# Same reason as `cc-firmware`: esp-idf-sys publishes its link arguments as
# `links` metadata, and Cargo does not forward a dependency's link args to a
# dependent package. Without this the link fails with hundreds of undefined
# references.
[build-dependencies]
embuild = "=0.33.5"

[lints]
workspace = true
