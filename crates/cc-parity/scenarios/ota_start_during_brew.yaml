# S8 — an OTA session started while the pump is running.
#
# While an OTA session is active the control loop does not run, so nothing drives
# the pump or the valve for the duration of a ~25 s flash. Beginning a session
# disables the heater and nothing else, and the design assumes the previous
# state's exit already cleaned up — which happened when the *brew* ended, not
# when the flash began.
name: ota_start_during_brew
title: An OTA session during a brew closes the pump and the valve, not just the heater
mode: dry_run
covers: [S8, S5]

duration_ms: 26000

why: >
  The scenario that makes the gap concrete. A flash started mid-brew leaves the
  pump and the three-way valve in whatever state the brew left them for the whole
  transfer unless the session shuts them down. This firmware performs
  `safe_hardware_shutdown()` — pump, valve and heater — and the state machine is
  not run for the session's duration.

  The assertion is the fix: the pump and valve were running when the session
  began, and nothing re-energises them while it is open.

config:
  set:
    pid.enabled: true
    brew.mode: 1                       # Automatic
    brew.pre_infusion.enabled: true
    brew.pre_infusion.time: 3.0
    brew.pre_infusion.pause: 0.0
    brew.by_time.enabled: false        # a manual brew, so the switch ends it
    hardware.switches.brew.enabled: true
    hardware.sensors.watertank.enabled: true

stimuli:
  - { at_ms: 0,    kind: button, switch: brew, action: press }
  - { at_ms: 100,  kind: sensor, temperature_c: 95.0, water_tank_full: true }
  # The flash starts 1 s in, with the pump and valve open.
  - { at_ms: 1000, kind: ota, action: begin, path: firmware.bin }
  # The session closes while the brew switch is still held, so the machine
  # resumes the interrupted shot. That is the point.
  - { at_ms: 20000, kind: ota, action: end }

capture:
  state_transitions: true
  effects: true

assert:
  # The pump and the valve were genuinely running when the flash began.
  - { kind: always, effect: EnablePump }
  - { kind: always, effect: OpenWaterValve }
  # And nothing re-energises them while the session is open. Bounded at 20 s,
  # where `ota: end` closes it: after that the machine is supposed to resume.
  - { kind: never, effect: EnablePump, after_ms: 1000, before_ms: 20000 }
  - { kind: never, effect: OpenWaterValve, after_ms: 1000, before_ms: 20000 }
  - { kind: always, effect: SafeHardwareShutdown }
  # NOT `no_fluid_flow`. The brew was a *manual* one and the brew switch is
  # still held at 20 s, so when the session closes the machine resumes the
  # interrupted shot and the pump comes back on. A flash does not cancel a brew,
  # it suspends the loop, and it is why the assertions above are windowed rather
  # than absolute. Asserting `no_fluid_flow` here would be asserting a
  # cancellation the firmware does not perform.
  - { kind: always, effect: EnterState }
