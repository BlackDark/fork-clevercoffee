[package]
name = "cc-web"
description = "CleverCoffee HTTP routes and handlers over a hardware-free backend trait (picoserve)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `POST /api/debug/hang`: stalls the control loop so the bench can prove the
# watchdog resets the device. Never in release images.
bench = []

[dependencies]
cc-api.workspace = true
cc-core.workspace = true
heapless.workspace = true
picoserve.workspace = true

[dev-dependencies]
picoserve = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["test-util"] }
serde_json = "1.0.154"

[lints]
workspace = true
