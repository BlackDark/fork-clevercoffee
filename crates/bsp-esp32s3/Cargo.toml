[package]
name = "clevercoffee-bsp-esp32s3"
description = "Board support for the ESP32 on the ESP32-DevKitC V4."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clevercoffee-domain = { workspace = true }
clevercoffee-hal-traits = { workspace = true }
clevercoffee-app = { workspace = true }
esp-hal = { workspace = true, features = ["esp32s3"] }
esp-rtos = { workspace = true, features = ["esp32s3"] }
esp-alloc = { workspace = true, features = ["esp32s3"] }

[features]
default = []
board-esp32s3 = []
prov-uart = []
prov-usb-cdc = []
mock-actuators = []
