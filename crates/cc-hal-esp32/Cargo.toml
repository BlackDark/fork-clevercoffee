[package]
name = "cc-hal-esp32"
description = "The only crate that talks to ESP-IDF: board, drivers, actuators, watchdog."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Compiles this crate's `#[test]` functions as `pub fn`s listed in
# `device_tests::CASES`, for the on-target runner (`just test-esp32`). Never
# enabled by the shipped `firmware`. Turns on `cc-net/device-tests` for the
# base64 encoder the authentication tests use.
device-tests = ["cc-net/device-tests"]

[dependencies]
cc-domain.workspace = true
cc-config.workspace = true
cc-machine.workspace = true
cc-protocol.workspace = true
cc-net.workspace = true
# `steam_flow_allowed` is applied inside `open_steam_valve`; naming the one
# whitelist keeps both callers on the same list.
cc-safety.workspace = true
# `cc_display::leds::LedOutput` only: which LEDs are lit is a display rule. The
# HAL never renders; frames arrive as `&[u8; 1024]` in the controller's order.
cc-display.workspace = true
ssd1306.workspace = true
# `ssd1306` returns `display_interface::DisplayError` without re-exporting it.
display-interface.workspace = true
esp-idf-hal.workspace = true
esp-idf-svc.workspace = true
esp-idf-sys.workspace = true
# The `embedded-svc` Wi-Fi configuration structs use `heapless::String`.
heapless.workspace = true
log.workspace = true
# Used only by this crate's tests, but a regular dependency: the on-target runner
# builds this crate as a library with `--features device-tests`, and Cargo does
# not link dev-dependencies into that. Nothing in the image names it.
serde_json.workspace = true

# The tests' encoder, unified into this crate's test target only, so
# `cargo clippy -p cc-hal-esp32 --all-targets` builds on its own and the library
# never sees the feature.
[dev-dependencies]
cc-net = { workspace = true, features = ["device-tests"] }

[lints]
workspace = true
