[package]
name = "cc-domain"
description = "CleverCoffee domain vocabulary: units, states, error codes, PID."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `cc-domain` has NO dependency on by default -- it is the crate a reviewer
# reads to be certain nothing influences a safety verdict (04 §6). This one is
# off by default and exists solely so `Secret<T>` can be transparent to
# serialisation, which `cc-config` needs to round-trip its four credential
# fields through the NVS blob. See `src/secret.rs`.
serde = ["dep:serde"]
# Compiles this crate's `#[cfg(any(test, feature = "device-tests"))]` items,
# so `cc-hal-esp32 --features device-tests` can reach them.
#
# It exists for exactly one thing: `http_auth::tests_support::encode`, which
# `cc-hal-esp32`'s authentication tests need to build an `Authorization`
# header. Those tests are executable only by flashing a device, so the encoder
# has to live in a crate they can compile against -- and duplicating a base64
# encoder into the device crate to avoid a feature flag is worse than one.
#
# NEVER enabled by the shipped `firmware` binary: only `cc-hal-esp32`'s
# `device-tests` feature turns it on, and nothing in a release build names
# that. Enabling it adds a base64 encoder and nothing else.
device-tests = []

[dependencies]
serde = { workspace = true, optional = true }

[lints]
workspace = true
