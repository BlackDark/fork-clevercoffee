[package]
name = "clevercoffee-ds18b20"
description = "DS18B20 command layer over the 1-Wire transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clevercoffee-hal-traits = { workspace = true }
clevercoffee-onewire = { workspace = true }

[dev-dependencies]
# The simulated bus, so these tests drive the real bus code rather than a stub of the device.
clevercoffee-onewire = { workspace = true, features = ["test-support"] }
