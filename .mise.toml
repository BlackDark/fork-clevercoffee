min_version = "2024.1.0"

# ── REQUIRED BEFORE `just setup` ─────────────────────────────────────────────
# rustup must already be installed and `cargo` must be on PATH. mise cannot manage
# it: mise's own `rust` tool installs a non-rustup Rust whose `cargo` shim shadows
# rustup's, which makes rust-toolchain.toml be ignored and the Xtensa build fail
# with "can't find crate for `core`". The same reason rules out mise's `cargo:`
# backend, so espflash/espup/ldproxy are installed by `just setup` at pinned
# versions instead.
#
#   brew install rustup          # or https://rustup.rs
#   rustup default stable        # populates ~/.cargo/bin with the cargo proxy
#
# Homebrew's formula installs only /opt/homebrew/bin/rustup; the cargo and rustc
# proxies live in ~/.cargo/bin, so that must be on PATH. `just doctor` checks all
# of this. See README.md and docs/rust-migration/tooling.md.

[tools]
  # Node.js + JS tooling
  node = "24"
  pnpm = "latest"

  # Python
  python = "3.14.7"

  # C++ tooling
  clang-format = "23.1.2"

  # Task runner
  just = "1.58.0"

[env]
  # Pinned ESP-IDF version for the Rust firmware. esp-idf-hal/svc require >=5.3;
  # ESP-IDF 7.0 is scheduled to remove the legacy I2C driver esp-idf-hal wraps,
  # so this stays on a 5.x release until that wrapper is replaced upstream.
  ESP_IDF_VERSION = "v5.3.6"
  # Keep the ESP-IDF checkout and tools out of the repo working tree.
  ESP_IDF_TOOLS_INSTALL_DIR = "global"

[settings]
  experimental = true
  jobs = 4
