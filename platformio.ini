[platformio]
lib_dir = lib
src_dir = src
extra_configs = platformio_extra.ini

[esp32_v1_base]
platform = espressif32 @^6.12.0
; platform_packages =
;   platformio/toolchain-xtensa-esp-elf @ 14.2.0+20241119
board = az-delivery-devkit-v4
board_build.filesystem = littlefs
board_build.partitions = partitions_4M.csv

build_flags =
  -I include/clevercoffee
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  -D CONFIG_ASYNC_TCP_PRIORITY=10
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
  -D CORE_DEBUG_LEVEL=0
  -D CONFIG_ARDUHAL_LOG_COLORS=0
  -D CONFIG_ASYNC_TCP_USE_WDT=0
  -D ASYNC_TCP_SSL_ENABLED=0
  #-std=gnu++17
  -std=gnu++2a # use C++23
  -D FRONTEND_PREPROCESSING=false
  #-DDEBUG_CONFIG_VERBOSE # to enable verbose logging from code
  #-D VERSION is configured via script -> auto_firmware_version.py

build_unflags =
  -std=gnu++11

framework = arduino
monitor_speed = 115200
check_tool = clangtidy
check_skip_packages = yes
lib_deps =
    lebuni/ZACwire for TSic @ 2.0.0
    milesburton/DallasTemperature @ 4.0.5
    paulstoffregen/OneWire @ 2.3.8
    olkal/HX711_ADC @ 1.2.12
    olikraus/U8g2 @ 2.36.15
    git+https://github.com/rancilio-pid/Arduino-PID-Library#d6d3c69
    knolleary/PubSubClient @ 2.8.0
    bblanchon/ArduinoJson @ 7.4.2
    ESP32Async/AsyncTCP @ 3.4.10
    ESP32Async/ESPAsyncWebServer @ 3.9.4
    git+https://github.com/tzapu/WiFiManager @ 2.0.17
    h2zero/NimBLE-Arduino@^2.3.2
    git+https://github.com/rancilio-pid/AcaiaArduinoBLE#v4.0.1

extra_scripts =
    pre:scripts/auto_firmware_version.py
    pre:scripts/run_clangformat.py
    #pre:scripts/auto_compression.py
    pre:scripts/build_frontend.py

[env:esp32_usb]
extends = esp32_v1_base
monitor_filters = esp32_exception_decoder
debug_tool = esp-prog
debug_init_break = tbreak setup
test_framework = googletest
lib_deps =
    ${esp32_v1_base.lib_deps}
      google/googletest @ ^1.15.2

[env:esp32_ota]
extends = esp32_v1_base
monitor_port = socket://silvia.local:23
upload_protocol = espota
upload_port = silvia.local
upload_flags = --auth=otapass

[env:native_test]
platform = native
test_framework = googletest
build_flags =
  -I test  # Add test directory FIRST to find Arduino.h stub before real one
  -I include/clevercoffee
  -include test/Arduino.h  # Force include Arduino stub before all other headers
  -std=gnu++2a
  -DARDUINO=100
  -DESP32
  -DARDUINOJSON_ENABLE_PROGMEM=0  # Disable PROGMEM for native builds
  -DARDUINOJSON_ENABLE_ARDUINO_STRING=0  # Use std::string instead of Arduino String
  -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0  # Disable Stream support
  -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0  # Disable Print support
lib_deps =
  google/googletest @ ^1.15.2
  bblanchon/ArduinoJson @ 7.4.2
; NOTE: test_build_src is not enabled because source files depend on hardware-specific
; libraries (U8G2, ESPAsyncWebServer, ESP32 timer functions) that are difficult to stub.
; Tests currently include .cpp files directly as a workaround.
; Future improvement: Create comprehensive hardware stubs or reorganize source files.
