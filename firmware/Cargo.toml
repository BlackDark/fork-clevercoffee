[package]
name = "clevercoffee-firmware"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "clevercoffee"
path = "src/main.rs"
test = false
bench = false

[dependencies]
esp-hal = { version = "=1.2.2", features = ["esp32", "log-04", "unstable"] }
esp-rtos = { version = "=0.4.0", features = ["esp32", "esp-radio", "esp-alloc", "embassy", "log-04"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32", "wifi", "ble", "coex", "esp-alloc", "unstable", "log-04"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32", "log-04"] }
esp-alloc = { version = "=0.11.0", features = ["esp32"] }
esp-println = { version = "=0.18.0", features = ["esp32", "log-04"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-storage = { version = "=0.10.0", features = ["esp32"] }
log = "0.4.28"
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.1", features = ["log"] }
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dhcpv4", "dns", "medium-ethernet", "log"] }
embedded-io-async = "0.7.0"
static_cell = "2.1.1"
picoserve = { version = "0.20.1", features = ["embassy", "json"] }
rust-mqtt = { version = "0.6.0", default-features = false, features = ["v5", "alloc"] }
trouble-host = { version = "0.7.0", features = ["central", "scan", "gatt"] }
bt-hci = "0.9.0"
edge-captive = "0.8.0"
edge-dhcp = "0.8.0"
edge-mdns = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"
heapless = "0.9.3"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
